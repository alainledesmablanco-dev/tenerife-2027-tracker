name: Rastreo Tenerife 2027

on:
  schedule:
    # Horas UTC. España peninsular en verano es UTC+2 → 08:00 y 20:00 locales.
    - cron: "0 6 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      avisar:
        description: "Enviar aviso a Telegram aunque no haya novedades"
        type: boolean
        default: true
      solo_vuelos:
        description: "Solo cotizar vuelos (rapido, sin avisos, sin tocar el historico)"
        type: boolean
        default: false

permissions:
  contents: write           # para guardar el histórico
  pages: write
  id-token: write

concurrency:
  group: rastreo
  cancel-in-progress: false

jobs:
  rastrear:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          # Sin --with-deps: ese flag lanza un apt-get update y los repos de
          # Microsoft del runner devuelven 403 a ratos, tumbando el job entero.
          # La imagen de ubuntu-latest ya trae las librerías que pide Chromium.
          playwright install chromium

      - name: Ejecutar rastreo
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          MAX_VENTANAS: "35"
          # Una sola búsqueda de OTAs al día: 30 al mes de las 250 gratuitas.
          MAX_VENTANAS_OTAS: "1"
          # En ejecucion manual manda el interruptor; las programadas van
          # silenciosas salvo que haya novedad de verdad.
          FORZAR_AVISO: ${{ inputs.avisar && '1' || '' }}
          # Prueba rapida de la parte de vuelos: reutiliza las tarifas de hotel
          # de la ultima pasada, salta el limite diario de SerpApi y no avisa.
          SOLO_VUELOS: ${{ inputs.solo_vuelos && '1' || '' }}
        run: python -m scraper.main

      - name: Avisar si el rastreo fallo
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          URL_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Un rastreador que se rompe en silencio es peor que no tenerlo.
          if [ -n "$TELEGRAM_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            MSG="El rastreo de Tenerife ha fallado.%0ANo se han podido leer precios en esta pasada.%0A${URL_RUN}"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d disable_web_page_preview=true \
              -d "text=${MSG}" > /dev/null
          fi

      - name: Guardar histórico
        run: |
          git config user.name  "rastreo-bot"
          git config user.email "actions@github.com"
          git add data/historico.json docs/index.html
          if git diff --staged --quiet; then
            echo "Sin cambios que guardar"
            exit 0
          fi
          git commit -m "Rastreo $(date -u +'%Y-%m-%d %H:%M') UTC"
          # El job hace checkout al empezar y tarda ~10 minutos. Si en ese rato
          # se empuja cualquier cosa a main, el push de aquí sale rechazado y se
          # pierde la pasada entera. Se reintenta rebasando sobre lo que haya.
          for intento in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rechazado; rebasando sobre origin/main (intento $intento)"
            git pull --rebase origin main
          done
          echo "No se pudo guardar el histórico tras 3 intentos"
          exit 1

      # if: always(), no if: failure(). En el run #58 los dos lectores de
      # aerolineas fallaron pero el job termino en verde —el rastreo esta
      # hecho para no morir cuando una web no responde— asi que no se subio
      # nada y hubo que adivinar. Los volcados solo existen si algo ha ido
      # mal, de modo que subirlos siempre no ensucia nada.
      - name: Subir capturas de depuración
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: depuracion
          path: |
            depuracion-*.png
            depuracion-*.html
          if-no-files-found: ignore
          retention-days: 7

  publicar:
    needs: rastrear
    # GitHub Pages solo acepta despliegues desde main por las reglas de
    # proteccion del entorno. Sin esta condicion, cualquier prueba en una rama
    # termina en rojo por un job que no podia funcionar, y un rojo que siempre
    # esta ahi deja de significar nada.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
