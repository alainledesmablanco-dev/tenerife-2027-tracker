name: Rastreo Tenerife 2027

on:
  schedule:
    # Horas UTC. España peninsular en verano es UTC+2 → 08:00 y 20:00 locales.
    - cron: "0 6 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:        # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write           # para guardar el histórico
  pages: write
  id-token: write

concurrency:
  group: rastreo
  cancel-in-progress: false

jobs:
  rastrear:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          # Sin --with-deps: ese flag lanza un apt-get update y los repos de
          # Microsoft del runner devuelven 403 a ratos, tumbando el job entero.
          # La imagen de ubuntu-latest ya trae las librerías que pide Chromium.
          playwright install chromium

      - name: Ejecutar rastreo
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          MAX_VENTANAS: "35"
          MAX_VENTANAS_OTAS: "3"
        run: python -m scraper.main

      - name: Guardar histórico
        run: |
          git config user.name  "rastreo-bot"
          git config user.email "actions@github.com"
          git add data/historico.json docs/index.html
          if git diff --staged --quiet; then
            echo "Sin cambios que guardar"
          else
            git commit -m "Rastreo $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi

      - name: Subir capturas si algo falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: depuracion
          path: |
            *.png
            *.html
          if-no-files-found: ignore

  publicar:
    needs: rastrear
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
